flash_patterns:
  - "高開|高开|低開|低开|收涨|收跌|漲停|涨停|跌停|午盘|早盘|收盘报|开盘报"
  - "今日开盘|今日收盘|午评|收评|盘前|盘中"
  - "快讯|快訊|实时新闻|滚动新闻"
  - "\\b(markets?|stocks?|shares?|futures?)\\s+(open|close)s?\\s+(higher|lower|up|down|flat)\\b"
  - "\\b(open|close)s?\\s+(up|down)\\s+\\d"
  - "^[A-Z][^.!?]{0,80}(rise|fell|rose|gain|drop)s?\\s+\\d+(\\.\\d+)?%"
  - "开盘.{0,20}[涨跌]\\s*\\d|收[盘盡].{0,20}[涨跌]\\s*\\d"
  - "^\\S{2,10}[：:]\\s*.{0,60}[涨跌]幅?\\s+\\d+(\\.\\d+)?%"

flash_sources:
  - sina
  - rollnews
  - live
  - telegraph
  - kuaixun

thresholds:
  min_text_len: 150       # 标题+摘要低于此长度视为太短
  min_title_len: 12       # 标题本身太短（几个字快讯标题）
  hard_min_text_len: 120  # 低于此长度无条件丢弃
  flash_news_max_len: 300 # 命中快讯正则且短于此长度丢弃
  flash_wrap_max_len: 500 # 标题堆叠行情词且正文短于此长度丢弃
  flash_source_max_len: 250  # 快讯源整体从严的长度线
