# 筛选规则配置 —— LLM 每周复盘学习时修改此文件，不改动 filter.py 代码
# 结构说明：
#   exclude:              排除词（政治/军事），命中且不含 keep_even_if_excluded 词时丢弃
#   keep_even_if_excluded: 保留词，政军背景下的经济/科技新闻仍保留
#   topics:               主题词表（china / tech / econ），命中任一主题即入选候选
#   flash_patterns:       快讯/行情短讯正则，配合长度阈值丢弃
#   flash_sources:        滚动短讯源关键词（匹配信源域名/路由），整体从严
#   thresholds:           长度阈值

